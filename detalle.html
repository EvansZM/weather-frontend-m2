<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora · Detalle del clima</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="./assets/css/main.css">
</head>

<body>

    <!-- ===== HEADER ===== -->
    <header class="main-header">
        <nav class="navbar navbar-expand-lg navbar-dark main-header">
            <div class="container">

                <a class="navbar-brand main-header__brand" href="#" onclick="irHome(); return false;">
                    Aurora
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarDetalle">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarDetalle">
                    <ul class="navbar-nav ms-auto main-header__nav">

                        <li class="nav-item">
                            <a class="nav-link main-header__link" href="#" onclick="irHome(); return false;">Home</a>
                        </li>

                        <li class="nav-item">
                            <span class="nav-link active main-header__link">Detalle</span>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link main-header__link" href="#" onclick="irAcerca(); return false;">Acerca de</a>
                        </li>

                    </ul>
                </div>

            </div>
        </nav>
    </header>

    <!-- ===== MAIN ===== -->
    <main class="place-detail py-4">
        <div class="container">

            <!-- PRESENTACIÓN -->
            <section class="place-detail__section mb-4">
                <div class="place-detail__box p-4 p-md-5">

                    <!-- Breadcrumb -->
                    <nav class="breadcrumb-nav mb-3">
                        <ol class="breadcrumb mb-0">
                            <li class="breadcrumb-item">
                                <a class="breadcrumb-nav__link" href="#" onclick="irHome(); return false;">Home</a>
                            </li>

                            <li class="breadcrumb-item active" id="breadcrumb-ciudad">
                                Ciudad
                            </li>
                        </ol>
                    </nav>

                    <!-- Título -->
                    <h1 id="nombre-ciudad" class="place-detail__title display-6 fw-bold mb-2">
                        Ciudad
                    </h1>

                    <!-- Descripción -->
                    <p id="descripcion-ciudad" class="place-detail__description mb-3">
                        Descripción dinámica
                    </p>

                    <!-- Resumen -->
                    <div class="place-detail__summary d-flex flex-wrap align-items-center gap-3">
                        <span id="estado-clima" class="badge text-bg-warning fs-6">
                            Estado
                        </span>

                        <span id="temperatura-actual" class="fw-semibold fs-5">
                            0°C
                        </span>
                    </div>

                </div>
            </section>

            <!-- INFO CIUDAD -->
            <section class="place-detail__section mb-4">
                <div class="place-detail__box p-4">

                    <h2 class="place-detail__subtitle h4 fw-bold mb-3">
                        Sobre la ciudad
                    </h2>

                    <p id="info-texto" class="place-detail__text mb-3"></p>

                    <div class="row g-3" id="info-cards"></div>

                </div>
            </section>

            <!-- CLIMA ACTUAL -->
            <section class="place-detail__section mb-4">

                <h2 class="place-detail__subtitle h4 fw-bold mb-3">
                    Clima actual
                </h2>

                <div class="row g-3">

                    <!-- Imagen -->
                    <div class="col-12 col-lg-6">
                        <article class="card place-detail__climate-card h-100 shadow-sm">
                            <img id="imagen-ciudad" class="card-img-top place-detail__image">

                            <div class="card-body">
                                <p id="descripcion-clima" class="mb-0"></p>
                            </div>
                        </article>
                    </div>

                    <!-- Métricas -->
                    <div class="col-12 col-lg-6">
                        <div class="row g-3" id="metricas-clima"></div>
                    </div>

                </div>
            </section>

            <!-- PRONÓSTICO -->
            <section class="place-detail__section mb-4">

                <h2 class="place-detail__subtitle h4 fw-bold mb-3">
                    Pronóstico semanal
                </h2>

                <div class="row g-3" id="pronostico"></div>

            </section>

        </div>
    </main>

    <!-- FOOTER -->
    <footer class="main-footer">
        <div class="container">
            <p class="main-footer__text mb-1 fw-semibold">
                Aurora · Tu clima en Chile
            </p>
        </div>
    </footer>

    <!-- JS -->
    <script src="./assets/js/main.js"></script>
    <script type="module" src="./assets/js/detalle.js"></script>

</body>
</html>
